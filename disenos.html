<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Punto de partida · Diseños para impresión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Presentación de los diseños 2D: diapositivas de 1920 × 1080, se imprime a PDF (una por página) */
@page{size:1920px 1080px;margin:0}
:root{--ink:#161514;--muted:#7a746b;--paper:#f3f1ec;--line:#d9d4ca;--rojo:#b3261e;--rojo2:#e5534b;--brand:"Bricolage Grotesque",sans-serif;--body:"Work Sans",sans-serif;--hand:"Caveat",cursive}
*{box-sizing:border-box}
html,body{margin:0;background:#888;font-family:var(--body);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.s{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--paper);margin:0 auto 24px;page-break-after:always;break-after:page}
@media print{html,body{background:none}.s{margin:0}}
.s.dark{background:#0f0e0d;color:#fff}
.hd{position:absolute;left:120px;top:96px;right:120px;display:flex;justify-content:space-between;align-items:flex-end}
.k{font:600 18px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--rojo)}
.dark .k{color:var(--rojo2)}
h1{font:800 150px/.92 var(--brand);letter-spacing:-.035em;margin:0}
h2{font:800 64px/1 var(--brand);letter-spacing:-.025em;margin:10px 0 0}
.lede{font:400 26px/1.45 var(--body);color:var(--muted);max-width:820px}
.dark .lede{color:#a9a39a}
.dark .spec{color:#a9a39a}.dark .spec b{color:#fff}
.pg{position:absolute;right:120px;bottom:64px;font:600 16px var(--body);letter-spacing:.14em;color:var(--muted)}
.ft{position:absolute;left:120px;bottom:64px;font:600 16px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.spec{font:500 20px/1.4 var(--body);color:var(--muted)}
.spec b{color:var(--ink);font-weight:600}
.thread{position:absolute;left:0;right:0;height:6px;background:var(--rojo)}
img.card{display:block;filter:drop-shadow(0 18px 26px rgba(0,0,0,.18)) drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.dark img.card{filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.cap{font:600 15px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:18px}
/* portada */
.cover .t{position:absolute;left:120px;top:300px}
.cover .meta{position:absolute;left:120px;bottom:110px;font:500 22px/1.6 var(--body);color:#a9a39a}
/* sistema */
.cols{position:absolute;left:120px;right:120px;top:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.mom .sw{height:240px;border-radius:6px;display:flex;align-items:flex-end;padding:26px;font:800 120px/1 var(--brand);letter-spacing:-.03em}
.mom h3{font:800 34px var(--brand);margin:22px 0 6px}
.mom p{font:400 20px/1.5 var(--body);color:var(--muted);margin:0}
.type{position:absolute;left:120px;right:120px;bottom:130px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1.1fr;gap:48px;border-top:2px solid var(--line);padding-top:30px}
.type .n{font:600 15px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.dots{display:flex;gap:10px;margin-top:6px}.dots i{width:38px;height:38px;border-radius:50%;display:block}
/* rejillas */
.grid{position:absolute;left:120px;right:120px;display:grid;justify-items:center;align-items:start}
table{border-collapse:collapse;font:500 22px var(--body);width:100%}
th{font:600 15px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 18px 14px;border-bottom:2px solid var(--ink)}
td{padding:17px 18px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n{font-weight:700}
.chip{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:10px;border:1px solid #0002}
.steps{position:absolute;left:120px;right:120px;top:360px;display:grid;grid-template-columns:repeat(4,1fr);gap:36px 48px}
.steps div{border-top:2px solid #ffffff33;padding-top:20px}
.steps b{display:block;font:800 44px var(--brand);color:var(--rojo2);margin-bottom:8px}
.steps span{font:500 24px/1.4 var(--body)}
</style>
</head><body>
<div id="deck"></div>
<script src="vendor/three.min.js?v=158"></script>
<script src="img_data.js?v=14"></script>
<script src="stand.js?v=23"></script>
<script>
(async function(){
"use strict";
const fonts=['800 100px "Bricolage Grotesque"','700 100px "Bricolage Grotesque"','500 40px "Work Sans"','600 40px "Work Sans"','400 40px "Work Sans"','700 60px Caveat','500 60px Caveat'];
try{await Promise.all(fonts.map(f=>document.fonts.load(f,"Ááé“·¿?01")));await document.fonts.ready;}catch(_){}
const ST=buildStand(THREE,new THREE.Scene());const A=ST.art;
const png=(c,q)=>q?c.toDataURL("image/jpeg",q):c.toDataURL("image/png");
const img=(src,w,extra)=>`<img class="card" src="${src}" style="width:${w}px;${extra||""}">`;
const N=["Lo que pasó","Lo que no se ve","Lo que volvió a tejer"];
const front=[0,1,2].map(k=>png(A.front(k,1.6),.93)),back=[0,1,2].map(k=>png(A.back(k,1.6),.93));
const q1=[...Array(8)].map((_,i)=>png(A.quote("dark",i,1.2))),q2=[...Array(3)].map((_,i)=>png(A.quote("gray",i,1.2)));
const tags=[...Array(5)].map((_,i)=>png(A.tag(i,1.5)));
const ph=await Promise.all([...Array(8)].map((_,k)=>A.photo(k,1.2).then(c=>png(c,.92))));
let P=0;const TOTAL=11;const pg=()=>`<div class="pg">${String(++P).padStart(2,"0")} / ${TOTAL}</div>`;
const ft=`<div class="ft">Punto de partida · Museo al aire libre</div>`;
const hd=(k,t,side)=>`<div class="hd"><div><div class="k">${k}</div><h2>${t}</h2></div><div class="spec" style="text-align:right">${side||""}</div></div>`;
const S=[];
/* 1 portada */
S.push(`<section class="s dark cover"><div class="thread" style="top:640px"></div>
  <div class="t"><div class="k">Museo al aire libre · Diseño de Exhibición</div><h1 style="margin-top:28px">Punto de<br>partida</h1>
  <p class="lede" style="margin-top:36px">Diseños para impresión: propalcotes, frases de la entrevista, etiquetas de destino y fotografías.</p></div>
  <div class="meta">Universidad CESMAG · Octubre de 2026</div>${pg()}</section>`);
/* 2 sistema */
const MOM=[["#0f0e0d","#fff","Negro: lo oscuro, el miedo, el enredo."],["#77736d","#fff","Gris: el limbo, la duda, lo que nadie ve."],["#f4f2ee","#1a1918","Blanco y color: la luz, la trama, volver a tejer."]];
S.push(`<section class="s">${hd("Sistema gráfico","Tres momentos, un hilo")}
  <div class="cols">${MOM.map((m,k)=>`<div class="mom"><div class="sw" style="background:${m[0]};color:${m[1]};${k===2?"border:2px solid var(--line)":""}">0${k+1}</div><h3>${N[k]}</h3><p>${m[2]}</p></div>`).join("")}</div>
  <div class="type">
    <div><div class="n">Títulos y números</div><div style="font:800 64px/1 var(--brand);letter-spacing:-.02em">Bricolage Grotesque</div></div>
    <div><div class="n">Textos</div><div style="font:500 34px/1.2 var(--body)">Work Sans<br><span style="font-size:22px;color:var(--muted)">historias y frases</span></div></div>
    <div><div class="n">Lo escrito a mano</div><div style="font:700 56px/1 var(--hand)">Caveat</div><div style="font:500 20px var(--body);color:var(--muted);margin-top:6px">destinos y pies de foto</div></div>
    <div><div class="n">El personaje y la trama</div><div class="dots"><i style="background:#b3261e"></i><i style="background:#e8b400"></i><i style="background:#2f6fd6"></i><i style="background:#2e9e4f"></i><i style="background:#e0218a"></i></div><div style="font:500 20px var(--body);color:var(--muted);margin-top:12px">el hilo rojo y los colores del bastidor 3</div></div>
  </div>${ft}${pg()}</section>`);
/* 3 los seis propalcotes */
S.push(`<section class="s">${hd("Propalcotes","Los seis, frente y respaldo","<b>47 × 32 cm</b> · 6 piezas<br>van centrados sobre el tablero negro")}
  <div class="grid" style="top:268px;grid-template-columns:repeat(3,1fr);gap:30px 48px">
  ${front.map((s,k)=>`<div>${img(s,440)}<div class="cap">0${k+1} · frente</div></div>`).join("")}
  ${back.map((s,k)=>`<div>${img(s,440)}<div class="cap">0${k+1} · respaldo</div></div>`).join("")}</div>${ft}${pg()}</section>`);
/* 4-6 cada momento */
const TXT=["Abre el recorrido. En el respaldo, el hilo rojo se enreda en un nudo.","El vacío y la duda. Del hilo salen caminos que terminan en nada.","El mismo hilo rojo va y vuelve hasta volverse trama."];
[0,1,2].forEach(k=>S.push(`<section class="s">${hd("Propalcote 0"+(k+1)+" · bastidor "+(k+1),N[k],"<b>47 × 32 cm</b> · frente y respaldo<br>"+TXT[k])}
  <div class="grid" style="top:360px;grid-template-columns:1fr 1fr;gap:64px">
    <div>${img(front[k],808)}<div class="cap">Frente · lo que lee la gente que pasa</div></div>
    <div>${img(back[k],808)}<div class="cap">Respaldo · número e ícono</div></div></div>${ft}${pg()}</section>`));
/* 7 frases bastidor 1 */
S.push(`<section class="s">${hd("Bastidor 1 · El enredo","Ocho frases de la entrevista","<b>15 × 10,7 cm</b> · 8 piezas<br>cuelgan del enredo con hilo crudo")}
  <div class="grid" style="top:330px;grid-template-columns:repeat(4,1fr);gap:48px 40px">${q1.map(s=>img(s,380)).join("")}</div>${ft}${pg()}</section>`);
/* 8 bastidor 2 */
S.push(`<section class="s">${hd("Bastidor 2 · Lo que no se ve","Tres frases y cinco destinos","Frases <b>15 × 10,7 cm</b> · 3 piezas<br>Etiquetas <b>5,5 × 9 cm</b> · 5 piezas")}
  <div class="grid" style="top:330px;grid-template-columns:repeat(3,1fr);gap:40px">${q2.map(s=>img(s,500)).join("")}</div>
  <div class="grid" style="top:720px;grid-template-columns:repeat(5,auto);justify-content:center;gap:0 70px">${tags.map((s,i)=>`<div style="transform:rotate(${[-4,3,-2,4,-3][i]}deg)">${img(s,150)}</div>`).join("")}</div>${ft}${pg()}</section>`);
/* 9 fotos */
S.push(`<section class="s">${hd("Bastidor 3 · Lo que volvió a tejer","Su proceso y sus obras","<b>15 × 10,7 cm</b> · 8 piezas, mismo formato que las frases<br>las 8 son las fotos finales")}
  <div class="grid" style="top:330px;grid-template-columns:repeat(4,1fr);gap:48px 40px">${ph.map(s=>img(s,380)).join("")}</div>${ft}${pg()}</section>`);
/* 10 impresión */
const R=[["#0f0e0d","Propalcote 01 · frente y respaldo","47 × 32 cm","2","2 pliegos"],["#77736d","Propalcote 02 · frente y respaldo","47 × 32 cm","2","2 pliegos"],["#f4f2ee","Propalcote 03 · frente y respaldo","47 × 32 cm","2","2 pliegos"],
  ["#0f0e0d","Frases · bastidor 1","15 × 10,7 cm","8","3 pliegos"],["#6f6b66","Frases · bastidor 2","15 × 10,7 cm","3","(en los mismos 3)"],["#faf8f3","Fotos","15 × 10,7 cm","8","(en los mismos 3)"],["#efe6d2","Etiquetas de destino","5,5 × 9 cm","5","(en los mismos 3)"]];
S.push(`<section class="s">${hd("Para imprimir","Piezas, medidas y pliegos","Pliego de <b>35 × 50 cm</b><br>≈ <b>9 pliegos</b> en total")}
  <div class="grid" style="top:330px;grid-template-columns:1fr;justify-items:stretch"><table><tr><th>Pieza</th><th>Medida final</th><th>Cantidad</th><th>Pliegos</th></tr>
  ${R.map(r=>`<tr><td><span class="chip" style="background:${r[0]}"></span>${r[1]}</td><td>${r[2]}</td><td class="n">${r[3]}</td><td>${r[4]}</td></tr>`).join("")}
  <tr><td><b>Total</b></td><td></td><td class="n">30 piezas</td><td><b>≈ 9 pliegos</b></td></tr></table>
  <p class="spec" style="margin-top:26px">Frases y fotos tienen la misma medida: caben 9 por pliego, así que las 19 tarjetas y las 5 etiquetas salen en 3 pliegos. Cada pieza se recorta a su medida y se le abre el agujero de arriba.</p></div>${ft}${pg()}</section>`);
/* 11 siguiente paso */
const STEP=["Imprimir los pliegos","Recortar y perforar","Armar los tres marcos","Clavar las puntillas","Tejer los hilos","Colgar frases, etiquetas y fotos","Pegar los propalcotes y clavar los tableros","Poner las bisagras y probar el plegado"];
S.push(`<section class="s dark"><div class="thread" style="top:300px;height:4px"></div>${hd("Siguiente paso","De la pantalla al taller","Modelo 3D: diseno-unicesmag.github.io/punto-de-partida/visor.html")}
  <div class="steps">${STEP.map((s,i)=>`<div><b>${String(i+1).padStart(2,"0")}</b><span>${s}</span></div>`).join("")}</div>${ft}${pg()}</section>`);
document.getElementById("deck").innerHTML=S.join("");
await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
document.body.dataset.ready="1";
})();
</script>
</body></html>
