<style>
/* Layout: escena WebGL a pantalla completa; capa HTML mínima por momento (rótulo, título, una línea) */

#ov .note{align-self:flex-start;margin-top:10px;background:#efe6d0;color:#2a2620;font:700 clamp(22px,1.8vw,30px)/1.1 var(--hand);padding:16px 22px 14px;transform:rotate(-2deg);box-shadow:0 18px 30px -16px rgba(0,0,0,.8);background-image:repeating-linear-gradient(transparent 0 27px,rgba(80,110,160,.25) 27px 28px)}

.lab{position:fixed;transform:translate(-50%,-50%);font:600 13px var(--body);color:#fff;background:rgba(14,13,12,.85);border:1px solid #3a3631;padding:4px 10px;border-radius:99px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .5s}
.lab.on{opacity:1}
.lab.dim{background:#f2efe8;color:#141210;border-color:#f2efe8;font-weight:700}
#dark{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 62% 48%,#1a1714 0,#0b0a09 70%);opacity:0;transition:opacity 2.2s ease}

#fly{position:fixed;inset:0;pointer-events:none}
#fly>*{position:absolute;opacity:0;scale:.9;transition:opacity .45s ease,scale .6s ease;animation:flo 7s ease-in-out infinite}

#fly .fnote{right:8vw;top:50%;margin-top:-130px;width:min(460px,36vw);box-sizing:border-box;background:#efe6d0;color:#2a2620;font:700 clamp(30px,3vw,46px)/1.05 var(--hand);padding:30px 34px 26px;rotate:2.5deg;box-shadow:0 30px 50px -20px rgba(0,0,0,.9);background-image:repeating-linear-gradient(transparent 0 37px,rgba(80,110,160,.25) 37px 38px)}

<script>
(async function(){
"use strict";
if(document.fonts&&document.fonts.ready){try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);}catch(_){}}
const T=THREE;
/* ================= render ================= */
const cv=document.getElementById("gl");
const R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.08;
const scene=new T.Scene();scene.background=new T.Color(0x1a1714);scene.fog=new T.Fog(0x1a1714,8,24);
const cam=new T.PerspectiveCamera(36,1,.03,80);
scene.add(new T.HemisphereLight(0xfff4e6,0x2a2520,.75));
const sun=new T.DirectionalLight(0xfff1dc,2.3);sun.position.set(3.2,6.5,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=4;
Object.assign(sun.shadow.camera,{left:-3.5,right:3.5,top:3.5,bottom:-3.5,near:1,far:20});sun.shadow.bias=-.0003;sun.shadow.normalBias=.02;scene.add(sun);
const fillL=new T.DirectionalLight(0xffe2c4,.6);fillL.position.set(-2,2.5,4);scene.add(fillL);
const rim=new T.DirectionalLight(0xbfd3ff,.7);rim.position.set(-4,3,-4);scene.add(rim);
/* ================= exhibidor (stand.js: medidas, bastidores, tapas, bisagras, cotas) ================= */
const ST=buildStand(T,scene);const {tex,rnd,ease,clamp,m,W,H,t,LT,TY0,TAPA,TAW,FD,frames,stand,hinges,conn,hung,dimG,DIMS,layout,buildDims}=ST;
let fold=0,foldT=0;
/* ================= calle ================= */
const pave=tex(1024,1024,(x,w,h)=>{x.fillStyle="#6f665c";x.fillRect(0,0,w,h);for(let r=0;r<16;r++)for(let c=0;c<9;c++){const off=r%2?64:0;x.fillStyle=`hsl(26,${8+((r*7+c*3)%6)}%,${42+((r*5+c*11)%9)}%)`;x.fillRect(c*128+off-64+3,r*64+3,122,58);}});
pave.wrapS=pave.wrapT=T.RepeatWrapping;pave.repeat.set(14,14);
const ground=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({map:pave,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const curb=new T.MeshStandardMaterial({color:0x5c544b,roughness:.9});[-4.4,4.4].forEach(z=>{const b=new T.Mesh(new T.BoxGeometry(40,.5,.3),curb);b.position.set(0,.25,z-.9);b.receiveShadow=true;scene.add(b);});
/* peatones: tubos que saltan, con piel y ropa variadas */
const people=new T.Group();scene.add(people);let pf=0,pfT=0;const SKIN=[0xf0d0b0,0xd9a77c,0xb67f57,0x8f5b3c,0xe2b996];const CLO=[0x3d5a80,0xc0392b,0x6c757d,0xe9a03b,0x2a9d8f,0x7b6fd0,0x6a994e,0xe07a5f,0x264653,0xf28482];
const LANES=[{z:2.2,dir:1,sp:.8},{z:2.85,dir:-1,sp:.7},{z:-2.1,dir:-1,sp:.75}];
LANES.forEach((ln,li)=>{for(let k=0;k<4;k++){const p=new T.Group();const mats=[];const mk=c=>{const m=new T.MeshStandardMaterial({color:c,roughness:.6,transparent:true});mats.push(m);return m;};
  const sc=.88+rnd()*.24;const body=new T.Mesh(new T.CapsuleGeometry(.17,.62,10,18),mk(CLO[(li*4+k*3)%CLO.length]));body.position.y=.48;const head=new T.Mesh(new T.SphereGeometry(.125,22,16),mk(SKIN[(li*2+k)%SKIN.length]));head.position.y=1.08;
  const bod=new T.Group();bod.add(body,head);bod.scale.setScalar(sc);p.add(bod);p.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  p.userData={ln,x:-9+k*4.5+li*1.4,bod,mats,ph:rnd()*6,f:5.2+rnd()*2.4,amp:.07+rnd()*.07,sw:rnd()*.08,sc};people.add(p);}});
/* ================= etiquetas ================= */
const labs=document.getElementById("labs");const LBL=[];function label(txt,getPos,cls){const d=document.createElement("div");d.className="lab"+(cls?" "+cls:"");d.textContent=txt;labs.appendChild(d);LBL.push({d,getPos});return d;}
const LG={tec:ST.notes.map(n=>label(n[0],n[1],n[2]))};
/* ================= cámara ================= */
const look=new T.Vector3(0,.95,0);let target={pos:new T.Vector3(3,1.6,4),look:look.clone()};let from=null,tween=1,tdur=1,afterT=0;let yaw=0,pitch=0,dist=0;
function goCam(pos,lk,d){from={pos:cam.position.clone(),look:look.clone()};target={pos:pos.clone(),look:lk.clone()};tween=0;tdur=d||2.2;yaw=pitch=0;dist=0;afterT=0;}
let dragging=false,lx=0,ly=0;cv.addEventListener("pointerdown",e=>{dragging=true;lx=e.clientX;ly=e.clientY;cv.classList.add("drag");cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(!dragging)return;yaw-=(e.clientX-lx)*.005;pitch=clamp(pitch+(e.clientY-ly)*.003,-.6,.6);lx=e.clientX;ly=e.clientY;});
addEventListener("pointerup",()=>{dragging=false;cv.classList.remove("drag");});
cv.addEventListener("wheel",e=>{e.preventDefault();dist=clamp(dist+e.deltaY*.0015,-.8,3);},{passive:false});
const V=(x,y,z)=>new T.Vector3(x,y,z);
function frameView(i,d,shift){const f=frames[i],c=V(W/2,1.08,0).applyMatrix4(f.matrixWorld),q=new T.Quaternion();f.matrixWorld.decompose(new T.Vector3(),q,new T.Vector3());
  const n=V(0,0,1).applyQuaternion(q),r=V(1,0,0).applyQuaternion(q);return {pos:c.clone().addScaledVector(n,d).addScaledVector(r,-.08).add(V(0,.1,0)),look:c.clone().addScaledVector(r,-(shift??.34))};}
function objView(h,d,shift){const o=h.card;o.updateMatrixWorld(true);const p=new T.Vector3();o.getWorldPosition(p);const q=new T.Quaternion();h.anchor.getWorldQuaternion(q);const n=V(0,0,1).applyQuaternion(q),r=V(1,0,0).applyQuaternion(q);
  return {pos:p.clone().addScaledVector(n,d).addScaledVector(r,-.02),look:p.clone().addScaledVector(r,-(shift??.11))};}
const H_=a=>hung.find(h=>h.anchor===a);
/* ================= momentos ================= */
const ov=document.getElementById("ov"),veil=document.getElementById("veil"),black=document.getElementById("black"),cred=document.getElementById("cred");
const C1=frames[0].userData.cards.map(H_),C2=frames[1].userData.cards.map(H_),PH=frames[2].userData.photos.map(H_);
function tapaView(i,d,shift){const f=frames[i],c=V(W/2,TY0+TAPA/2,t/2+LT).applyMatrix4(f.matrixWorld),q=new T.Quaternion();f.matrixWorld.decompose(new T.Vector3(),q,new T.Vector3());
  const n=V(0,0,1).applyQuaternion(q),r=V(1,0,0).applyQuaternion(q);return {pos:c.clone().addScaledVector(n,d).add(V(0,.06,0)),look:c.clone().addScaledVector(r,-(shift??.26))};}
const lab=(a,b,c)=>`<span class="k">${a}</span><h2>${b}</h2><p class="st">${c}</p>`;
const S=[
 {ch:1,n:"Inicio",cred:1,dark:1,view:()=>({pos:V(2.1,2.0,3.9),look:V(-.55,.85,0)}),html:`<span class="k">Museo al aire libre</span><h1>Punto <span class="lt">de</span><br>partida</h1><p>Del enredo a la trama: una historia de desplazamiento y resiliencia contada con hilos.</p>`},
 {n:"La historia",dark:1,fly:"note",view:()=>({pos:V(2.1,2.0,3.9),look:V(-.55,.85,0)}),html:`<span class="k">La historia</span><h2>Una voz que habla por muchas</h2><p>Una mujer campesina salió de su vereda por la violencia y llegó a la ciudad sin saber qué hacer. Hoy teje. Su historia es la de muchas familias desplazadas en Colombia.</p>`},
 {n:"Bocetos",dark:1,fly:"boc",view:()=>({pos:V(2.1,2.0,3.9),look:V(-.55,.85,0)}),html:`<span class="k">El proceso</span><h2>Primero, a mano</h2><p>Antes del diseño final, los bocetos: dos ideas que descartamos, el primer trazo del telar, sus exploraciones y la prueba de color.</p>`},
 {ch:1,n:"Así se arma",build:1,view:()=>({pos:V(2.1,2.0,3.9),look:V(-.55,.85,0)}),html:`<span class="k">El exhibidor</span><h2>Tres bastidores, un telar</h2><p>Marcos de listón de ${t*100} × ${t*100} cm, de ${m(W)} × ${m(H)} m, con bisagras alternas: se pliegan en acordeón y se abren en zigzag.</p>`},
 {ch:1,n:"Bastidor 1",view:()=>frameView(0,2.7),html:`<span class="k">Lo que pasó</span><h2>Bastidor 1</h2><p>Hilo rojo amarrado de puntilla en puntilla hasta volverse un nudo, y ocho frases textuales de la entrevista.</p>`},
 {n:"Bastidor 1 · la tapa",view:()=>tapaView(0,1.15),soft:1,html:lab("Lo que pasó","Bastidor 1","La historia, en la tapa")},
 {n:"Bastidor 1 · la tienda",view:()=>objView(C1[0],.36,.1),soft:1,html:lab("Lo que pasó","Bastidor 1","Frases reales")},
 {n:"Bastidor 1 · en la mitad",view:()=>objView(C1[4],.36,.1),soft:1,html:lab("Lo que pasó","Bastidor 1","Frases reales")},
 {n:"Bastidor 1 · los niños",view:()=>objView(C1[7],.36,.1),soft:1,html:lab("Lo que pasó","Bastidor 1","Frases reales")},
 {ch:1,n:"Bastidor 2",view:()=>frameView(1,2.7),swing:1,html:`<span class="k">Lo que no se ve</span><h2>Bastidor 2</h2><p>Del hilo rojo salen caminos rectos que terminan en otros hilos, con destinos tachados. Solo el del medio sigue.</p>`},
 {n:"Bastidor 2 · la tapa",view:()=>tapaView(1,1.15),soft:1,swing:1,html:lab("Lo que no se ve","Bastidor 2","La historia, en la tapa")},
 {n:"Bastidor 2 · salir",view:()=>objView(C2[0],.36,.1),soft:1,swing:1,html:lab("Lo que no se ve","Bastidor 2","Frases reales")},
 {n:"Bastidor 2 · sin saber",view:()=>objView(C2[1],.36,.1),soft:1,swing:1,html:lab("Lo que no se ve","Bastidor 2","Frases reales")},
 {n:"Bastidor 2 · ciudad y campo",view:()=>objView(C2[2],.36,.1),soft:1,swing:1,html:lab("Lo que no se ve","Bastidor 2","Frases reales")},
 {ch:1,n:"Bastidor 3",view:()=>frameView(2,2.7),html:`<span class="k">Lo que volvió a tejer</span><h2>Bastidor 3</h2><p>El hilo rojo entra a una trama tupida y ordenada. Ocho fotos cuentan su oficio de abajo hacia arriba.</p>`},
 {n:"Bastidor 3 · la tapa",view:()=>tapaView(2,1.15),soft:1,html:lab("Lo que volvió a tejer","Bastidor 3","La historia, en la tapa")},
 {n:"Bastidor 3 · el comienzo",view:()=>{const a=objView(PH[5],.8,0),b=objView(PH[7],.8,0);return {pos:a.pos.clone().lerp(b.pos,.5),look:a.look.clone().lerp(b.look,.5).add(V(-.1,0,0))};},soft:1,html:lab("Lo que volvió a tejer","Bastidor 3","Su trabajo")},
 {n:"Bastidor 3 · hoy",view:()=>{const a=objView(PH[0],.95,0),b=objView(PH[1],.95,0);return {pos:a.pos.clone().lerp(b.pos,.5),look:a.look.clone().lerp(b.look,.5).add(V(-.1,0,0))};},soft:1,html:lab("Lo que volvió a tejer","Bastidor 3","Su trabajo")},
 {ch:1,n:"Las tapas",view:()=>({pos:V(.3,.95,3.6),look:V(-.75,.4,0)}),html:`<span class="k">Lo informativo</span><h2>Cada momento, con su tapa</h2><p>Abajo, tableros de triplex clavados sobre el marco por las dos caras: amarran el bastidor y lo hacen más firme. Al frente, el número, el título y la historia de ese momento.</p>`},
 {n:"Las tapas · atrás",view:()=>{const f=frames[1],c=V(W/2,.45,-(t/2+LT)).applyMatrix4(f.matrixWorld),q=new T.Quaternion();f.matrixWorld.decompose(new T.Vector3(),q,new T.Vector3());const n=V(0,0,-1).applyQuaternion(q),r=V(1,0,0).applyQuaternion(q);return {pos:c.clone().addScaledVector(n,2.6).add(V(0,.35,0)),look:c.clone().addScaledVector(r,.5).add(V(0,-.05,0))};},html:`<span class="k">Lo informativo</span><h2>Y por detrás, el símbolo</h2><p>El nudo, los caminos sin destino y la trama: cada momento se reconoce por su número y su símbolo desde el otro lado.</p>`},
 {n:"Un hilo que no se corta",view:()=>({pos:V(.4,1.5,2.9),look:V(-.4,1.1,0)}),bare:1,html:`<span class="k">El personaje</span><h2>Un hilo que no se corta</h2><p>Un solo hilo rojo atraviesa los tres bastidores: se enreda en el primero, se abre en caminos sin destino en el segundo y se vuelve parte del tejido en el tercero. Es el recorrido de ella.</p>`},
